<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">

</head>
<body>
    <!-- ========================================== -->
    <!-- NAVBAR KHUSUS HALAMAN GAME -->
    <!-- ========================================== -->
    <nav class="navbar" style="position: relative; z-index: 999;">
        <div class="logo">
            <span class="icon">🎙️</span>
            <strong>VocaTune</strong>
        </div>

        <ul class="nav-links">
            <!-- Tombol Pause yang langsung dimunculkan -->
            <li>
                <a href="#" id="navPause" class="btn-pause-circle" style="display: inline-flex;">
                    <svg width="14" height="16" viewBox="0 0 14 16" fill="currentColor">
                        <rect x="0" y="0" width="4" height="16" rx="1"></rect>
                        <rect x="10" y="0" width="4" height="16" rx="1"></rect>
                    </svg>
                </a>
            </li>
        </ul>
    </nav> 

    <!-- Wadah game -->
     <div id="game-container" style="display: flex; position: relative; width: 800px; height: 580px; margin: 30px auto 0 auto;">
        
        <!-- Kotak ketik di mode medium -->
        <div id="medium-input-overlay">
            <div class="input-header">
                <span class="icon-keyboard">⌨️</span>
                <strong>Ketik Jawaban</strong>
            </div>
            <p class="input-subtext">Tulis jawabanmu secara manual untuk mendapatkan poin penuh (+100 XP)!</p>
            
            <input type="text" id="inputJawabanMedium" placeholder="Ketik jawabanmu di sini..." autocomplete="off">
            <button id="btnSubmitMedium" class="btn-primary">Kirim Jawaban <span style="margin-left: 5px;">✔️</span></button>
        </div>
    </div> 
    <!-- Kotak pause -->
    <div id="modalPause" class="modal-overlay" style="display: none;">
        <div class="modal-box">
            <h3>⏸️ Permainan Dijeda</h3>
            <div class="modal-buttons">
                <button id="btnResumeModal" class="btn-primary">▶ Lanjutkan</button>
                <button id="btnMainLagiModal" class="btn-secondary">🔄 Main Lagi</button>
                <button id="btnHomePause" class="btn-secondary">🏠 Ke Beranda</button>
            </div>
        </div>
    </div>
    <!-- ========================================== -->
    <!-- SCRIPT UNTUK HALAMAN GAME -->
    <!-- ========================================== -->
    <script src="js/pixi.min.js"></script> <!-- PIXI HANYA DIPANGGIL DI SINI -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/supabase.js"></script>
    <script type="module" src="js/data.js"></script> <!-- Berisi bankSoal -->
    <script type="module" src="js/game.js"></script> <!-- Logika kanvas game-mu -->
</body>
</html>
