<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performa & Rekor - VocaTune</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <body>
    <!-- ================= NAVBAR ================= -->
    <nav class="navbar" style="position: relative; z-index: 999; border-bottom: 1px solid #e2e8f0; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; background: white;">
        <div class="logo">
            <span class="icon">🎙️</span>
            <strong>VocaTune</strong>
        </div>
        <ul class="nav-links" style="display: flex; gap: 30px; list-style: none; margin: 0; padding: 0;">
            <li><a href="index.html" style="text-decoration: none; color: #64748b; font-weight: bold;">Home</a></li>
            <li><a href="#" style="text-decoration: none; color: #2b3a4a; font-weight: bold;">Leaderboard</a></li>
        </ul>
        <!-- Tambahkan id="btnProfileNav" agar bisa diubah oleh JavaScript -->
        <div id="btnProfileNav" class="btn-profile" style="border: 2px solid #2b3a4a; padding: 5px 15px; border-radius: 20px; font-weight: bold;">
            👤 Player
        </div>
    </nav> 


    <section style="display: block; padding: 40px 20px;">
        <div class="statistik-container" style="max-width: 800px; margin: 0 auto;">
            <div class="statistik-header">
                <h2>PERFORMA & REKOR AKUN</h2>
                <p>Raihlah skor terbaik dalam setiap ronde tebak kosa kata untuk menaiki anak tangga leaderboard global VocaTune!</p>
            </div>

            <!-- 4 Kartu Statistik Global -->
            <div class="stat-card-wide" id="global-performa-section">
                <div class="global-stats-grid">
                    <div class="global-stat-item">
                        <div class="stat-icon">⭐</div>
                        <div class="stat-text">
                            <span class="stat-label">Skor Terbaik</span>
                            <span class="stat-value"><span id="dbHighestScore">0</span> XP</span>
                        </div>
                    </div>
                    <div class="global-stat-item">
                        <div class="stat-icon">📖</div>
                        <div class="stat-text">
                            <span class="stat-label">Streak tertinggi</span>
                            <span class="stat-value" id="dbHighestStreak">0</span>
                        </div>
                    </div>
                    <div class="global-stat-item">
                        <div class="stat-icon">🔥</div>
                        <div class="stat-text">
                            <span class="stat-label">Total Hari Bermain</span>
                            <span class="stat-value" id="dbTotalDays">0</span>
                        </div>
                    </div>
                    <div class="global-stat-item">
                        <div class="stat-icon">🔖</div>
                        <div class="stat-text">
                            <span class="stat-label">Total Skor</span>
                            <span class="stat-value"><span id="dbTotalScore">0</span> XP</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tombol Kembali (Pastikan ID-nya persis ini) -->
            <div style="margin-top: 30px; text-align: center;">
                <button id="btnKembaliHome" class="btn-primary" style="background-color: #FFD700; color: #2b3a4a; padding: 10px 30px; border-radius: 20px; font-weight: bold; border: 2px solid #2b3a4a;">🏠 Ke Beranda</button>
            </div>
        </div>
    </section>

    <!-- Tombol BGM -->
    <button id="btnBgm" class="btn-bgm" style="position: fixed; bottom: 20px; right: 20px; padding: 10px 20px; border-radius: 20px; background: #2b3a4a; color: white; cursor: pointer; z-index: 100;">🔊 Music On</button>
    <audio id="bgmAudio" loop autoplay><source src="assets/bgm/s.mp3" type="audio/mpeg"></audio>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="js/supabase.js"></script>
    <script type="module" src="js/performa.js"></script>
</body>
</html>
